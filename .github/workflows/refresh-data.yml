name: Weekly roster refresh

# Pulls the latest completed season's real rosters from stats.nba.com (free,
# no API key, via the nba_api package) and merges them into players_awards.json,
# so the game's player pool keeps including the newest season and its rookies
# without anyone manually re-running a scrape. Weekly is plenty: rosters and
# trades don't move hourly, unlike live game data.
on:
  schedule:
    - cron: "17 9 * * 1" # Monday mornings, UTC
  workflow_dispatch:
    inputs:
      season_label:
        description: "nba_api season string, e.g. 2025-26"
        required: false
        default: "2025-26"
      season_year:
        description: "This dataset's season number for that season (2025-26 -> 2026)"
        required: false
        default: "2026"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install refresh dependencies
        run: pip install -r backend/requirements-refresh.txt

      - name: Refresh current-season rosters
        run: |
          python backend/refresh_current_season.py \
            --season-label "${{ github.event.inputs.season_label || '2025-26' }}" \
            --season-year "${{ github.event.inputs.season_year || '2026' }}"

      # A failed fetch exits 0 with "nothing to merge" (season not started) and leaves
      # the file untouched, so there's nothing destructive to guard against here.
      - name: Commit updated roster data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/players_awards.json
          git diff --cached --quiet && exit 0
          git commit -m "Weekly roster refresh"
          git push
